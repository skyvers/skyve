<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>A</title>
</head>
<body>
<p id="tick">A</p>
<script>
// Something that keeps changing, so that the screencast has frames to send
let n = 0;
setInterval(() => { document.getElementById('tick').textContent = 'A ' + (++n); }, 100);
// Resolves once the service worker controls this page (it claims its clients as it activates), and so has cached b.html
window.serviceWorkerReady = new Promise((resolve) => {
	if (navigator.serviceWorker.controller) {
		resolve(true);
	}
	else {
		navigator.serviceWorker.addEventListener('controllerchange', () => resolve(true), { once: true });
	}
});
navigator.serviceWorker.register('/screencast/sw.js');
</script>
</body>
</html>
